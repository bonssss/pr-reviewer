services:
  postgres:
    image: postgres:16-alpine
    container_name: pr-reviewer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pr_reviewer}
    # No host port: only the backend on the internal network can reach Postgres.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pr_reviewer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pr-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pr-reviewer-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Reachable only through the frontend reverse proxy.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pr_reviewer}?schema=public"
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Required secrets: compose refuses to start when they are not exported.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ENABLE_AUTO_REVIEW: ${ENABLE_AUTO_REVIEW:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    networks:
      - pr-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pr-reviewer-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - pr-network

networks:
  pr-network:
    driver: bridge

volumes:
  postgres_data:
